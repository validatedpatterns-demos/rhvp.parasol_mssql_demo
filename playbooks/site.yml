---
# Full demo deployment: SQL Server on Windows, app on RHEL via quadlet.
#
# Run me: ansible-galaxy collection install -r requirements.yml && ansible-playbook -i host.yml playbooks/site.yml
- name: Deploy SQL Server 2022 for the Parasol demo
  hosts: mssql_windows
  roles:
    - role: rhvp.parasol_mssql_demo.mssql_win

- name: Deploy the Parasol app with podman quadlet
  hosts: parasol_rhel
  roles:
    # Set quadlet_app_rhsm_register=true (+ credentials) for an unregistered
    # RHEL host; see roles/quadlet_app/defaults/main.yml.
    - role: rhvp.parasol_mssql_demo.quadlet_app
