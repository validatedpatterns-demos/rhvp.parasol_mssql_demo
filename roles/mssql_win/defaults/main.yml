---
# Chocolatey package providing SQL Server 2022 (Developer edition)
mssql_win_chocolatey_package: sql-server-2022

# Pin a specific version (e.g. '16.0.1000.20260902') or leave empty for latest
mssql_win_chocolatey_package_version: ""

# Chocolatey source; point at an internal repo for offline installs
mssql_win_chocolatey_source: https://community.chocolatey.org/api/v2/

# SQL Server 2022 Setup parameters passed through to Setup.exe
mssql_win_sa_password: P@rasol-2026-Sql
mssql_win_sysadmin_accounts: "{{ ansible_user_domain }}\\{{ ansible_username }}"

# Default instance for SQL Server 2022
mssql_win_instance: MSSQLSERVER

# Instance registry path (SQL Server 2022 => MSSQL16.<INSTANCE>)
mssql_win_registry_instance: "MSSQL16.{{ mssql_win_instance }}"

# TCP listener for remote clients
mssql_win_tcp_enabled: true
mssql_win_tcp_port: 1433

# Database the app expects (Hibernate drop-and-create fills the schema)
mssql_win_database: parasol

mssql_win_service_name: "{{ mssql_win_instance }}"
mssql_win_setup_timeout: 7200
