---
- name: Ensure Chocolatey is installed
  chocolatey.chocolatey.win_chocolatey:
    name: chocolatey
    state: present

# SQL Setup refuses to run when Windows has a pending reboot (common after
# .NET / servicing packages pulled in by Chocolatey on a fresh golden image).
- name: Reboot if Windows has a pending reboot before SQL Setup
  ansible.windows.win_reboot:
  when: ansible_reboot_pending | default(false)

- name: Prepare secondary disk for SQL Server data files
  ansible.windows.win_shell: "{{ lookup('ansible.builtin.template', 'prepare-data-disk.ps1.j2') }}"
  register: mssql_win_data_disk
  changed_when: (mssql_win_data_disk.stdout | trim) == 'created'
  when: mssql_win_data_drive_letter | length > 0

- name: Ensure SQL Server data directories exist on the data volume
  ansible.windows.win_file:
    path: "{{ item }}"
    state: directory
  loop:
    - "{{ mssql_win_data_root }}"
    - "{{ mssql_win_data_root }}\\Data"
    - "{{ mssql_win_data_root }}\\Log"
    - "{{ mssql_win_data_root }}\\TempDB"
    - "{{ mssql_win_data_root }}\\Backup"
  when: mssql_win_data_root | length > 0

# WinRM sessions cannot call DPAPI (ProtectedData.Protect) — SQL Setup then
# fails with 0x84b10001 / CryptographicException "Access is denied" while
# serializing AgentConfigurationPublic. A one-shot Scheduled Task runs as
# Administrator with a loaded profile so Setup succeeds. Plain
# win_chocolatey keeps working for the idempotent "already installed" path.
- name: Check whether SQL Server Chocolatey package is already installed
  ansible.windows.win_shell: |
    $pkg = '{{ mssql_win_chocolatey_package }}'
    $hit = & choco list --limit-output 2>$null | Where-Object { $_ -like "$pkg|*" }
    if ($hit) { Write-Output 'present' } else { Write-Output 'absent' }
  register: mssql_win_choco_state
  changed_when: false

- name: Build SQL Setup package-parameters
  ansible.builtin.set_fact:
    mssql_win_setup_params: >-
      {{ mssql_win_setup_params_base }}
      /SAPWD:"{{ mssql_win_sa_password }}"
      {{ mssql_win_setup_params_data }}
    mssql_win_install_stamp: "{{ lookup('pipe', 'date -u +%Y%m%d%H%M%S') }}"
  no_log: true
  when: (mssql_win_choco_state.stdout | trim) == 'absent'

- name: Set install log paths for the Scheduled Task script
  ansible.builtin.set_fact:
    mssql_win_install_log: "C:\\Windows\\Temp\\parasol-mssql-choco-{{ mssql_win_install_stamp }}.log"
    mssql_win_install_marker: "C:\\Windows\\Temp\\parasol-mssql-choco-{{ mssql_win_install_stamp }}.exitcode"
    mssql_win_install_script: "C:\\Windows\\Temp\\parasol-mssql-choco-{{ mssql_win_install_stamp }}.ps1"
  when: (mssql_win_choco_state.stdout | trim) == 'absent'

- name: Stage SQL Server Chocolatey install script
  ansible.windows.win_template:
    src: install-sql-server.ps1.j2
    dest: "{{ mssql_win_install_script }}"
  no_log: true
  when: (mssql_win_choco_state.stdout | trim) == 'absent'

- name: Install SQL Server 2022 via Scheduled Task
  ansible.windows.win_shell: |
    $ErrorActionPreference = 'Stop'
    if (-not '{{ ansible_password }}') {
      throw 'ansible_password is required so the Scheduled Task can log on as Administrator (DPAPI/profile).'
    }
    $taskName = 'parasol-mssql-choco-install'
    $log = '{{ mssql_win_install_log }}'
    $marker = '{{ mssql_win_install_marker }}'
    $scriptPath = '{{ mssql_win_install_script }}'
    $timeout = {{ mssql_win_setup_timeout | int }}

    Unregister-ScheduledTask -TaskName $taskName -Confirm:$false -ErrorAction SilentlyContinue
    Remove-Item $marker -Force -ErrorAction SilentlyContinue

    $action = New-ScheduledTaskAction -Execute 'powershell.exe' `
      -Argument "-NoProfile -ExecutionPolicy Bypass -File `"$scriptPath`""
    $settings = New-ScheduledTaskSettingsSet -AllowStartIfOnBatteries `
      -DontStopIfGoingOnBatteries -StartWhenAvailable `
      -ExecutionTimeLimit (New-TimeSpan -Seconds ($timeout + 300))
    Register-ScheduledTask -TaskName $taskName -Action $action `
      -Settings $settings -User 'Administrator' `
      -Password '{{ ansible_password }}' -RunLevel Highest -Force | Out-Null

    Start-ScheduledTask -TaskName $taskName

    $deadline = (Get-Date).AddSeconds($timeout + 180)
    while (-not (Test-Path $marker)) {
      if ((Get-Date) -gt $deadline) {
        throw "Timed out waiting for scheduled task $taskName (log: $log)"
      }
      Start-Sleep -Seconds 10
    }

    $exitCode = [int](Get-Content $marker -ErrorAction Stop)
    Unregister-ScheduledTask -TaskName $taskName -Confirm:$false -ErrorAction SilentlyContinue
    Remove-Item $scriptPath -Force -ErrorAction SilentlyContinue

    if ($exitCode -ne 0) {
      $tail = if (Test-Path $log) { Get-Content $log -Tail 40 | Out-String } else { '<no log>' }
      throw "Chocolatey install of {{ mssql_win_chocolatey_package }} failed with exit code $exitCode.`n$tail"
    }
    Write-Output 'installed'
  no_log: true
  register: mssql_win_install_task
  changed_when: (mssql_win_install_task.stdout | default('') | trim) == 'installed'
  when: (mssql_win_choco_state.stdout | trim) == 'absent'

- name: Record SQL Server install result
  ansible.builtin.set_fact:
    mssql_win_install:
      changed: "{{ (mssql_win_install_task is changed) | default(false) }}"
      reboot_required: false
  when: mssql_win_install_task is defined

- name: Skip install when SQL Server package is already present
  ansible.builtin.set_fact:
    mssql_win_install:
      changed: false
      reboot_required: false
  when: (mssql_win_choco_state.stdout | trim) == 'present'

- name: Reboot after SQL Server installation if the installer requested it
  ansible.windows.win_reboot:
  when: mssql_win_install.reboot_required | default(false)

- name: Wait for the SQL Server service to exist
  ansible.windows.win_service_info:
    name: "{{ mssql_win_service_name }}"
  register: mssql_win_service_info
  until: mssql_win_service_info.services | length > 0
  retries: 30
  delay: 10

- name: Enable TCP/IP for the instance
  ansible.windows.win_regedit:
    path: >-
      HKLM:\SOFTWARE\Microsoft\Microsoft SQL Server\{{ mssql_win_registry_instance }}\MSSQLServer\SuperSocketNetLib\Tcp
    name: Enabled
    data: 1
    type: dword
    state: present
  register: mssql_win_tcp_enabled_reg
  when: mssql_win_tcp_enabled

- name: Set the TCP port for the instance
  ansible.windows.win_regedit:
    path: >-
      HKLM:\SOFTWARE\Microsoft\Microsoft SQL Server\{{ mssql_win_registry_instance }}\MSSQLServer\SuperSocketNetLib\Tcp\IPAll
    name: TcpPort
    data: "{{ mssql_win_tcp_port | string }}"
    type: string
    state: present
  register: mssql_win_tcp_port_reg
  when: mssql_win_tcp_enabled

- name: Restart SQL Server so the TCP settings take effect
  ansible.windows.win_service:
    name: "{{ mssql_win_service_name }}"
    state: restarted
  when: (mssql_win_tcp_enabled_reg is defined and mssql_win_tcp_enabled_reg.changed)
        or (mssql_win_tcp_port_reg is defined and mssql_win_tcp_port_reg.changed)

- name: Open the firewall for SQL Server port
  ansible.windows.win_shell: |
    $ruleName = 'SQL Server (Parasol demo)'
    if (-not (Get-NetFirewallRule -DisplayName $ruleName -ErrorAction SilentlyContinue)) {
      New-NetFirewallRule -DisplayName $ruleName `
        -Direction Inbound -Protocol TCP -LocalPort {{ mssql_win_tcp_port }} `
        -Action Allow -Profile Any | Out-Null
      Write-Output created
    }
  register: mssql_win_firewall
  changed_when: (mssql_win_firewall.stdout | trim) == 'created'
  when: mssql_win_tcp_enabled

- name: Wait for TCP port to accept connections
  ansible.windows.win_wait_for:
    port: "{{ mssql_win_tcp_port }}"
    delay: 5
  when: mssql_win_tcp_enabled

# lookup('template', 'file.j2') resolves against this role's templates/
# directory; a playbook-relative roles/... path breaks when the collection
# is installed under ~/.ansible/collections.
- name: Create the demo database
  ansible.windows.win_shell: "{{ lookup('ansible.builtin.template', 'create-demo-database.ps1.j2') }}"
  register: mssql_win_db_create
  changed_when: (mssql_win_db_create.stdout | trim) == 'created'
  no_log: true

- name: Report SQL Server readiness
  ansible.builtin.debug:
    msg: >-
      SQL Server {{ mssql_win_instance }} is ready on
      {{ ansible_facts['fqdn'] }}:{{ mssql_win_tcp_port }},
      database {{ mssql_win_database }}
