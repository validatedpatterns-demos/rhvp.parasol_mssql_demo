---
- name: Assert required variables are set
  ansible.builtin.assert:
    that:
      - quadlet_app_mssql_host is defined
      - quadlet_app_mssql_host | length > 0
    fail_msg: >-
      Set `quadlet_app_mssql_host` to the DNS name or IP of the Windows Server
      running SQL Server before deploying the app.

- name: Register the system with Red Hat subscription-manager
  community.general.redhat_subscription:
    state: present
    username: "{{ quadlet_app_rhsm_username | default(omit, true) }}"
    password: "{{ quadlet_app_rhsm_password | default(omit, true) }}"
    org_id: "{{ quadlet_app_rhsm_org_id | default(omit, true) }}"
    activationkey: "{{ quadlet_app_rhsm_activation_key | default(omit, true) }}"
    release: "{{ quadlet_app_rhsm_release | default(omit, true) }}"
    auto_attach: true
  become: true
  no_log: true
  when: quadlet_app_rhsm_register | bool

- name: Ensure podman is installed
  ansible.builtin.dnf:
    name: podman
    state: present
  become: true
  register: quadlet_app_podman_install
  until: quadlet_app_podman_install is succeeded

- name: Log in to the image registry (optional)
  containers.podman.podman_login:
    username: "{{ quadlet_app_registry_username }}"
    password: "{{ quadlet_app_registry_password }}"
    registry: quay.io
  become: true
  no_log: true
  when: quadlet_app_registry_username | length > 0

- name: Create the quadlet unit for the app container
  ansible.builtin.template:
    src: parasol-app.container.j2
    dest: "{{ quadlet_app_quadlet_dir }}/{{ quadlet_app_service_name }}.container"
    owner: root
    group: root
    mode: "0644"
  become: true
  notify:
    - Reload systemd
    - Restart the app container

- name: Apply handlers so systemd knows about the unit
  ansible.builtin.meta: flush_handlers

- name: Keep :latest images fresh with podman-auto-update
  ansible.builtin.systemd:
    name: podman-auto-update.timer
    enabled: true
    state: started
  become: true

- name: Enable and start the app container service
  ansible.builtin.systemd:
    name: "{{ quadlet_app_service_name }}.service"
    enabled: true
    state: started
    daemon_reload: true
  become: true
  register: quadlet_app_service_start

- name: Wait for the app to become ready
  ansible.builtin.uri:
    url: "http://localhost:{{ quadlet_app_http_port }}/q/health/ready"
    status_code: 200
    timeout: 5
  register: quadlet_app_ready
  until: quadlet_app_ready.status == 200
  retries: 30
  delay: 10
  changed_when: false

- name: Report app URL
  ansible.builtin.debug:
    msg: >-
      Parasol app is up:
      http://{{ ansible_facts['default_ipv4']['address'] }}:{{ quadlet_app_http_port }}/
