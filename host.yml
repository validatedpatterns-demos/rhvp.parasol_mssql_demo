---
# Example inventory. Replace hostnames and supply credentials via ansible-vault
# (see examples/vault.yml.example). Do not commit real passwords.
#
# For OpenShift Virtualization guests created by edge-gitops-vms, prefer
# examples/inventory-edge-gitops-vms.yml and examples/edge-gitops-vms-values.yaml.
#
# The app hosts must point quadlet_app_mssql_host at the Windows SQL Server
# host that the mssql_windows group deploys.
all:
  children:
    mssql_windows:
      hosts:
        parasol-sql01:
          ansible_host: "192.0.2.50"
          ansible_user: Administrator
          ansible_password: "{{ vault_win_admin_password }}"
          ansible_connection: winrm
          ansible_port: 5985
          ansible_winrm_transport: basic
          ansible_winrm_scheme: http
          ansible_winrm_server_cert_validation: ignore
          mssql_win_sa_password: "{{ vault_mssql_sa_password }}"
    parasol_rhel:
      hosts:
        parasol-app01:
          ansible_host: "192.0.2.60"
          ansible_user: cloud-user
          ansible_become: true
          # ansible_password: "{{ vault_rhel_password }}"  # if not using SSH keys
          quadlet_app_mssql_host: "parasol-sql01"
          quadlet_app_mssql_password: "{{ vault_mssql_sa_password }}"
