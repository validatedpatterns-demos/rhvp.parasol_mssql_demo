---
# Chocolatey package providing SQL Server 2022 (Developer edition)
mssql_win_chocolatey_package: sql-server-2022

# Pin a specific version (e.g. '16.0.1000.20260902') or leave empty for latest
mssql_win_chocolatey_package_version: ""

# Chocolatey source; point at an internal repo for offline installs
mssql_win_chocolatey_source: https://community.chocolatey.org/api/v2/

# SQL Server 2022 Setup parameters passed through to Setup.exe
mssql_win_sa_password: P@rasol-2026-Sql
mssql_win_sysadmin_accounts: "BUILTIN\\Administrators"

# Default instance for SQL Server 2022
mssql_win_instance: MSSQLSERVER

# Instance registry path (SQL Server 2022 => MSSQL16.<INSTANCE>)
mssql_win_registry_instance: "MSSQL16.{{ mssql_win_instance }}"

# TCP listener for remote clients
mssql_win_tcp_enabled: true
mssql_win_tcp_port: 1433

# Database the app expects (Hibernate drop-and-create fills the schema)
mssql_win_database: parasol

# Optional second disk for SQL data/log/tempdb/backup files.
# When mssql_win_data_drive_letter is set (e.g. "D"), the role:
#   1) brings the first non-system RAW/unlettered disk online as that letter
#   2) passes /INSTALLSQLDATADIR (and related paths) into SQL Setup
#   3) creates the demo database files under mssql_win_data_root
# Leave empty to keep Chocolatey's default paths on the OS volume.
mssql_win_data_drive_letter: ""
mssql_win_data_disk_label: SQLData
mssql_win_data_root: "{{ (mssql_win_data_drive_letter | default('') | length > 0) | ternary(mssql_win_data_drive_letter ~ ':\\MSSQL', '') }}"

# Base Setup.exe switches always passed through Chocolatey --package-parameters.
# SAPWD is appended at runtime (see tasks) so the password stays out of defaults.
mssql_win_setup_params_base: >-
  /SQLSYSADMINACCOUNTS:"{{ mssql_win_sysadmin_accounts }}"
  /SECURITYMODE:"SQL"

mssql_win_setup_params_data: >-
  {{
    (mssql_win_data_root | length > 0) | ternary(
      '/INSTALLSQLDATADIR:"' ~ mssql_win_data_root ~ '" '
      ~ '/SQLUSERDBDIR:"' ~ mssql_win_data_root ~ '\Data" '
      ~ '/SQLUSERDBLOGDIR:"' ~ mssql_win_data_root ~ '\Log" '
      ~ '/SQLTEMPDBDIR:"' ~ mssql_win_data_root ~ '\TempDB" '
      ~ '/SQLTEMPDBLOGDIR:"' ~ mssql_win_data_root ~ '\TempDB" '
      ~ '/SQLBACKUPDIR:"' ~ mssql_win_data_root ~ '\Backup"',
      ''
    )
  }}

mssql_win_service_name: "{{ mssql_win_instance }}"
mssql_win_setup_timeout: 7200
