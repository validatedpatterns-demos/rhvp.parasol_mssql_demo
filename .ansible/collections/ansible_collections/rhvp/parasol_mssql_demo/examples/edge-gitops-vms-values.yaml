---
# Example edge-gitops-vms values shipped with this collection
# (rhvp.parasol_mssql_demo/examples/). Pair with
# inventory-edge-gitops-vms.yml and vault.yml.example.
#
# Chart: https://github.com/mhjacks/edge-gitops-vms-chart (0.5.*)
#
# Usage:
#   helm upgrade --install parasol-vms edge-gitops-vms \
#     -n edge-gitops-vms --create-namespace \
#     -f examples/edge-gitops-vms-values.yaml
# Or pass this file as a Pattern application's extraValueFiles entry.
#
# Produced object names follow {os}-{role}-{index}:
#   windows2k22-mssql-001
#   rhel9-parasol-001
#
# Adjust storageClassName and serviceType for your cluster. Do not put
# registry passwords here — use registryCredentialExternalSecrets + Vault
# (or create the pull secret out of band).

vmNamespace: edge-gitops-vms

vmDefaults:
  # Prefer a virt-friendly StorageClass (chart also has setDefaultVirtStorageClass).
  storageClassName: ocs-storagecluster-ceph-rbd-virtualization
  accessMode: ReadWriteMany
  volumeMode: Block
  runStrategy: Always
  machineType: q35
  # VirtIO is correct for golden images that already include VirtIO drivers
  # (e.g. quay.io/martjack/windows-server-*-standard). Use sata for generic
  # Windows images that do not.
  mainDiskStorageBus: virtio
  # ClusterIP is enough when Ansible/AAP runs in-cluster and uses Service DNS.
  # Switch to NodePort or LoadBalancer to reach VMs from outside the cluster.
  serviceType: ClusterIP
  publishService: false

# Optional: only needed when the Windows containerdisk lives in a private registry.
registryCredentialExternalSecrets:
  quay-creds:
    vaultKey: secret/data/hub/quay-image-robot

externalDataSources:
  - name: windows2k22
    type: registry
    # Golden image with VirtIO, OpenSSH, and WinRM baked in (Administrator
    # password set at image build time — the chart does not cloud-init
    # Windows guests).
    url: "docker://quay.io/martjack/windows-server-2022-standard:latest"
    size: 40Gi
    registryCredentialsSecret: quay-creds

vms:
  # SQL Server guest for rhvp.parasol_mssql_demo.mssql_win
  mssql:
    count: 1
    role: mssql
    # OS string MUST contain "windows" (case-insensitive) so the chart skips
    # cloud-init / SSH accessCredentials and enables TPM.
    os: windows2k22
    # Must match an externalDataSources[].name (or omit and rely on os == name).
    dataVolume: windows2k22
    efi: true
    flavor: medium
    workload: server
    template: windows2k22-server-medium
    # SQL Setup is memory-hungry; 4Gi is the chart Windows minimum, 8Gi is safer.
    memory: 8Gi
    cores: 4
    sockets: 1
    threads: 1
    # OS + SQL binaries on the boot disk; database files go on additionalDisks.
    storage: 60Gi
    additionalDisks:
      - name: sqldata
        storage: 100Gi
        # VirtIO matches mainDiskStorageBus for the golden image above.
        bus: virtio
    ports:
      - name: ssh
        port: 22
        protocol: TCP
        targetPort: 22
      - name: winrm-http
        port: 5985
        protocol: TCP
        targetPort: 5985
      - name: mssql
        port: 1433
        protocol: TCP
        targetPort: 1433

  # Quarkus / podman-quadlet guest for rhvp.parasol_mssql_demo.quadlet_app
  parasol:
    count: 1
    role: parasol
    os: rhel9
    # Uses the cluster DataSource named "rhel9" in
    # openshift-virtualization-os-images (chart default namespace).
    flavor: medium
    workload: server
    template: rhel9-server-medium
    memory: 4Gi
    cores: 2
    sockets: 1
    threads: 1
    storage: 40Gi
    # cloud-init + SSH authorized_keys come from Vault via ExternalSecrets
    # (vmDefaults.cloudinitsecret / sshsecret) unless disableExternalSecrets.
    ports:
      - name: ssh
        port: 22
        protocol: TCP
        targetPort: 22
      - name: http
        port: 8080
        protocol: TCP
        targetPort: 8080
