releases:
  1.0.0:
    release_date: "2026-10-30"
    changes:
      release_summary: "Initial release: mssql_win (Chocolatey SQL Server 2022 on Windows Server) and quadlet_app (podman quadlet deployment on RHEL) roles."
      minor_changes:
        - quadlet_app role deploys the container image with /etc/containers/systemd quadlet units and podman-auto-update.
        - mssql_win role installs SQL Server 2022 via Chocolatey, enables TCP/IP + mixed-mode auth and creates the demo database.
